name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --tb=short
      - run: python -m extractor.cli --help
      - run: python -m extractor.cli placement probe --output output/benign-probes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probes-${{ matrix.os }}-${{ matrix.python }}
          path: output/benign-probes.json
  gui-imports:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r gui/requirements.txt
      - run: python -m compileall -q extractor gui
      - run: python scripts/smoke_gui.py
        timeout-minutes: 2
        env:
          KIVY_GL_BACKEND: angle_sdl2
          SDL_OPENGL_ES_DRIVER: '1'
